<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCG Chatbot Test Page</title>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 40px; text-align: center; }
h1 { color: #1a3a5c; }
p { color: #666; max-width: 600px; margin: 20px auto; line-height: 1.6; }
.reset-btn { margin-top: 20px; padding: 10px 20px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<h1>Complete Contractor Group</h1>
<p>This is a test page for the CCG chatbot widget. The chatbot should appear in the bottom-right corner after 15 seconds, or click the chat icon to open it immediately.</p>
<p><strong>Embed code for Wix:</strong><br><code>&lt;script src="https://ccg-chatbot.netlify.app/chatbot.js"&gt;&lt;/script&gt;</code></p>
<button class="reset-btn" onclick="localStorage.removeItem('ccg-dismissed');localStorage.removeItem('ccg-submitted');location.reload();">Reset Chatbot (for testing)</button>

<script src="chatbot.js"></script>
</body>
</html>
